# Stage 8 - Continuous Integration: run tests, then build the Docker image.
# GitHub reads every *.yml in .github/workflows/ and runs it on the matching event.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest        # a fresh Ubuntu VM GitHub gives us for free
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install -r requirements-api.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  build:
    runs-on: ubuntu-latest
    needs: test                    # only build if tests pass
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Create models directory
        run: mkdir -p models

      - name: Fetch model from GitHub Release
        run: gh release download model-v1 --pattern 'housing_pipeline.joblib' --dir models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t housing-api:ci .