# The STABLE front door for the API pods.
# Pods are disposable and get a NEW IP every time they are replaced;
# the Service name and virtual IP never change.
# Inside the cluster, other pods reach this as http://api:8000

apiVersion: v1
kind: Service
metadata:
  name: api

spec:
  type: NodePort                 # also open a port on the node so the HOST can reach it
  selector:
    app: housing-api             # forwards to every pod carrying this label
  ports:
    - port: 8000                 # port on the Service's virtual IP (cluster-internal)
      targetPort: 8000           # the pod's containerPort to forward to
      nodePort: 30080            # port on the node for outside access (30000-32767)